name: Agent cleanup
on:
  workflow_dispatch:
  schedule:
    - cron: '53 7 * * *'
permissions:
  contents: write
concurrency:
  group: agent-cleanup
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Load the last committed snapshot
        run: bash tools/agents/prepare.sh
      - name: Run cleanup
        id: work
        continue-on-error: true
        env:
          AGENTS_HALT: ${{ vars.AGENTS_HALT }}
          LANGUAGE_PRODUCTION_HALT: ${{ vars.LANGUAGE_PRODUCTION_HALT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git branch -r --merged origin/main | sed 's#^ *origin/##' | grep -v ' -> ' > /tmp/branches.txt || true
          python3 -m tools.agents.cli cleanup --list /tmp/branches.txt > /tmp/delete.txt
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            # The shell is the last check. agents/data is the fleet checkpoint
            # and is never a cleanup target, even if the name list is wrong.
            case "$branch" in
              main|master|gh-pages|agents/data|refs/heads/agents/data|refs/heads/main|refs/heads/master)
                echo "refusing to delete protected ref: $branch" >&2
                continue
                ;;
              language-production/*|agents/tmp/*)
                ;;
              *)
                echo "refusing to delete ref outside the cleanup allowlist: $branch" >&2
                continue
                ;;
            esac
            git push origin --delete "$branch"
          done < /tmp/delete.txt

      - name: Publish the checkpoint
        if: always()
        run: bash tools/agents/publish.sh cleanup
      - name: Record the agent result
        if: steps.work.outcome == 'failure'
        run: exit 1
