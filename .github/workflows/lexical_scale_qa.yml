# Public-only QA and manually requested source-gated work; no pack publication.
name: Lexical Scale QA and Gated Worker
on:
  pull_request:
    paths:
      - 'tools/factory_extensions/lexical_scale/**'
      - 'tests/factory_extensions/lexical_scale/**'
      - '.github/workflows/lexical_scale_qa.yml'
  workflow_dispatch:
    inputs:
      source_id:
        description: 'Exact Route05-approved dictionary source ID; empty = QA only'
        required: false
        type: string
      language:
        description: 'Canonical registered language ID'
        required: false
        type: string
      shard:
        description: 'Zero-based deterministic shard'
        required: false
        type: number
        default: 0
      shards:
        description: 'Immutable shard count'
        required: false
        type: number
        default: 1
permissions:
  contents: read
concurrency:
  group: lexical-scale-${{ github.ref }}-${{ inputs.source_id }}-${{ inputs.language }}-${{ inputs.shard }}
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Canonical 100-language registry
        run: python3 catalog/validate_registry.py
      - name: Isolated synthetic QA
        run: python3 -m unittest discover -s tests/factory_extensions/lexical_scale -p 'test_*.py' -v
      - name: Reject production dispatch when source ledger is empty
        if: github.event_name == 'workflow_dispatch' && inputs.source_id != ''
        shell: bash
        env:
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=json.loads(Path('legal/ledger/sources.json').read_text())
          approved=[s for s in root.get('sources',[]) if s.get('source_id')==os.environ['SOURCE_ID'] and s.get('status')=='APPROVED_FOR_REDISTRIBUTION']
          if len(approved)!=1:
              raise SystemExit('BLOCKED_SOURCE: no exact approved Route05 dictionary snapshot')
          print('Route05 entry found; worker independently revalidates artifact and evidence SHA.')
          PY
  admitted_worker:
    if: github.event_name == 'workflow_dispatch' && inputs.source_id != '' && inputs.language != ''
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      SOURCE_ID: ${{ inputs.source_id }}
      LANGUAGE_ID: ${{ inputs.language }}
      SHARD: ${{ inputs.shard }}
      SHARDS: ${{ inputs.shards }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Process only immutable Route05 artifact included in checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lexical-scale" "$RUNNER_TEMP/candidates"
          python3 tools/factory_extensions/lexical_scale/adapter.py \
            --root . --source-id "$SOURCE_ID" --language "$LANGUAGE_ID" \
            --shard "$SHARD" --shards "$SHARDS" \
            --checkpoint "$RUNNER_TEMP/lexical-scale/checkpoint.sqlite" \
            | tee "$RUNNER_TEMP/lexical-scale/receipt.json"
          python3 tools/factory_extensions/lexical_scale/export.py \
            --checkpoint "$RUNNER_TEMP/lexical-scale/checkpoint.sqlite" \
            --language "$LANGUAGE_ID" --out "$RUNNER_TEMP/candidates/fragments"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
      - name: Validate each bounded lexical fragment before retaining candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from standards.lexical.validate import validate
          root=Path(os.environ['RUNNER_TEMP'])/'candidates/fragments'
          for item in json.loads((root/'manifest.json').read_text())['fragments']:
              validate(json.loads((root/item['path']).read_text()), publication=False)
          print('Validated lexical review candidates, NOT publication approval.')
          PY
      - name: Short-retention recovery checkpoint and review-only candidates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lexical-scale-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.language }}-${{ inputs.shard }}
          path: |
            ${{ runner.temp }}/lexical-scale/
            ${{ runner.temp }}/candidates/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
