name: Public snapshot transport synthetic QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/snapshot_transport_qa.yml'
      - 'tools/factory_extensions/snapshot_transport/**'
      - 'tests/factory_extensions/snapshot_transport/**'
      - 'tools/gha_factory/admission/**'
      - 'legal/ledger/sources.json'
      - 'catalog/language_registry.v1.json'
      - 'legal/ledger/license_notice.py'
permissions:
  contents: read
concurrency:
  group: public-snapshot-transport-qa
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'moaz76943-creator/-offline-packs-store'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic-only fault and recovery tests
        run: python3 -m unittest discover -s tests/factory_extensions/snapshot_transport -p 'test_*.py' -v
      - name: Report source blockers (no dispatch)
        run: |
          python3 - <<'PY'
          import json
          from tools.gha_factory.dispatcher import queue
          with open('legal/ledger/sources.json', encoding='utf-8') as f:
              ledger=json.load(f)
          approved=[x for x in ledger.get('sources',[]) if x.get('status')=='APPROVED_FOR_REDISTRIBUTION']
          print(json.dumps({'approved_sources':len(approved),
             'source_snapshot_queue_enabled':'source_snapshot' in queue.TASK_TYPES,
             'real_downloads':0,'published_assets':0,'persistent_storage_integrated':False},sort_keys=True))
          PY
