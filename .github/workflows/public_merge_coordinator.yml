# Read-only PR verification is isolated from scheduled privileged integration.
name: Public Verified Merge Coordinator
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/merge_coordinator/**"
      - ".github/workflows/public_merge_coordinator.yml"
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        description: 'Allow approved promote/merge; otherwise report'
        required: false
        default: false
  # React to existing required PR checks instead of waiting for the hourly sweep.
  # This privileged job only executes trusted main, never PR code or artifacts.
  workflow_run:
    workflows: ["Public PR Merge Gate"]
    types: [completed]
  # One hourly recovery sweep; successful hosted PR checks trigger immediate runs.
  schedule:
    - cron: '13 * * * *'

permissions:
  contents: read

concurrency:
  group: public-canonical-main-integration-authority
  cancel-in-progress: false

jobs:
  verify-coordinator:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out PR merge ref, no persistent token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact code policy regressions
        run: python3 -m unittest discover -s tools/merge_coordinator -p 'test_*.py' -v
  coordinate:
    if: >-
      github.repository == 'moaz76943-creator/-offline-packs-store' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    permissions:
      contents: write
      pull-requests: write
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INTEGRATOR_APPLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.apply }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: main
      - name: Verify coordinator contracts
        run: python3 -m unittest discover -s tools/merge_coordinator -p 'test_*.py' -v
      - name: Enforce visible strict main protection before any write
        id: protection
        run: python3 tools/merge_coordinator/protection_gate.py
      - name: Evaluate evidence and at most one transition
        if: steps.protection.outputs.allowed == 'true'
        run: python3 tools/merge_coordinator/coordinator.py
