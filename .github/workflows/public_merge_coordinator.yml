# Read-only PR verification is isolated from scheduled privileged integration.
name: Public Verified Merge Coordinator
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/merge_coordinator/**"
      - ".github/workflows/public_merge_coordinator.yml"
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        description: 'Allow approved promote/merge; otherwise report'
        required: false
        default: false
  schedule:
    - cron: '43 * * * *'

permissions:
  contents: read

concurrency:
  group: public-canonical-main-integration-authority
  cancel-in-progress: false

jobs:
  verify-coordinator:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out PR merge ref, no persistent token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact code policy regressions
        run: python3 -m unittest discover -s tools/merge_coordinator -p 'test_*.py' -v
  coordinate:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'moaz76943-creator/-offline-packs-store' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INTEGRATOR_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify coordinator contracts
        run: python3 -m unittest discover -s tools/merge_coordinator -p 'test_*.py' -v
      - name: Evaluate evidence and at most one transition
        run: python3 tools/merge_coordinator/coordinator.py
