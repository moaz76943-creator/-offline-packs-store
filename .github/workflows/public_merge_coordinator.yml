# Bounded integration automation; no untrusted PR code is executed.
name: Public Verified Merge Coordinator
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        description: 'Allow approved promote/merge; otherwise only report'
        required: false
        default: false
  schedule:
    - cron: '43 * * * *'

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: public-canonical-main-integration-authority
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.repository == 'moaz76943-creator/-offline-packs-store' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INTEGRATOR_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify coordinator contracts
        run: python3 -m unittest discover -s tools/merge_coordinator -p 'test_*.py' -v
      - name: Evaluate exact GitHub evidence and at most one transition
        run: python3 tools/merge_coordinator/coordinator.py
