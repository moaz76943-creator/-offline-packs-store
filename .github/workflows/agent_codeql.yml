name: Agent CodeQL
on:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * *'
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: agent-codeql
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@v3
