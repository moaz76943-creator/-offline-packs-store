name: Grammar Evidence Read-Only QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/factory_extensions/grammar_evidence/**'
      - 'tests/factory_extensions/grammar_evidence/**'
      - '.github/workflows/grammar_evidence_qa.yml'
  push:
    branches: [main]
    paths:
      - 'tools/factory_extensions/grammar_evidence/**'
      - 'tests/factory_extensions/grammar_evidence/**'
      - '.github/workflows/grammar_evidence_qa.yml'
permissions:
  contents: read
concurrency:
  group: grammar-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 -m unittest discover -s tests/factory_extensions/grammar_evidence -p 'test_*.py' -v
  shards:
    needs: unit
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Deterministic fail-closed validation
        run: |
          python3 tools/factory_extensions/grammar_evidence/factory.py --repo-root . --shard "${{ matrix.shard }}" --shards 4 > grammar-receipt.json
          python3 -c "import json; r=json.load(open('grammar-receipt.json')); print('status:', r['status'], 'language_count:', r['language_count'], 'verified_rules:', sum(x['verified_rules'] for x in r['languages'].values()))"
          echo "shard=${{ matrix.shard }} sha=${GITHUB_SHA} status=$(python3 -c 'import json; print(json.load(open("grammar-receipt.json"))["status"])')" >> "$GITHUB_STEP_SUMMARY"
