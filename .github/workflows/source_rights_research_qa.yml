name: Source rights research QA (read only)
on:
  pull_request:
    paths:
      - tools/factory_extensions/source_rights_research/**
      - tests/factory_extensions/source_rights_research/**
      - .github/workflows/source_rights_research_qa.yml
  workflow_dispatch:
    inputs:
      capture_public_evidence:
        description: Capture bounded official public license pages; never approve data
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  rights-qa:
    if: github.repository == 'moaz76943-creator/-offline-packs-store'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail-closed research and existing Route05 regressions
        run: |
          python3 -m unittest discover -s tests/factory_extensions/source_rights_research -p 'test_*.py' -v
          python3 -m unittest discover -s legal/ledger -p 'test_*.py' -v
      - name: Create human review queue for all 100 languages
        shell: bash
        run: python3 tools/factory_extensions/source_rights_research/audit.py --out "$RUNNER_TEMP/source-rights-report"
      - name: Opt-in public evidence snapshot audit
        if: github.event_name == 'workflow_dispatch' && inputs.capture_public_evidence == true
        shell: bash
        run: python3 tools/factory_extensions/source_rights_research/audit.py --out "$RUNNER_TEMP/source-rights-report" --capture-public-evidence
      - name: Retain only short-lived research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-rights-research-${{ github.run_id }}
          path: ${{ runner.temp }}/source-rights-report/
          if-no-files-found: ignore
          retention-days: 1
