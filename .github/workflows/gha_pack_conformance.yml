name: Strict SQLite v2 pack conformance (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 2'
  pull_request:
    paths:
      - 'tools/gha_factory/pack_conformance/**'
      - 'tests/gha_factory/pack_conformance/**'
      - 'tools/pack_conformance/**'
      - 'standards/lexical/**'
      - '.github/workflows/gha_pack_conformance.yml'
permissions:
  contents: read
concurrency:
  group: gha-pack-conformance
  cancel-in-progress: false
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install canonical compiler validation dependency
        run: timeout 90s python3 -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.26.0
      - name: Run deterministic isolated regression suite and source gate
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 2097152
          ulimit -f 262144
          ulimit -t 240
          export PYTHONDONTWRITEBYTECODE=1
          timeout 120s python3 -m unittest discover -s tests/gha_factory/pack_conformance -v
          timeout 120s python3 -m unittest discover -s standards/lexical -p 'test_*.py' -v
          timeout 120s python3 -m unittest discover -s tools/pack_conformance -p 'test_*.py' -v
          timeout 45s python3 -m tools.gha_factory.pack_conformance.check --root . > "$RUNNER_TEMP/conformance-status.json"
          cat "$RUNNER_TEMP/conformance-status.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'conformance-status.json').read_text())
          assert result['publication_approved'] is False
          assert result['actual_packs_verified'] == 0
          assert result['status'] in ('BLOCKED_SOURCE','BLOCKED_DEPENDENCY')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Strict conformance regressions passed. Source gate: '+result['status']+'\n')
              out.write('Real candidates verified: 0. Signing/device tests: NOT_RUN. No release approval.\n')
          PY
          git diff --exit-code -- manifest.json version.json legal/ledger/sources.json
