# Keep the required job unfiltered. GitHub may natively skip pull_request
# scheduling for commit-level skip directives; this workflow does not ban
# their text or treat an absent required check as passing.
name: Public PR Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: public-pr-merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-pr-merge-gate:
    name: public-pr-merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out GitHub synthetic PR merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Authenticate exact PR head on synthetic merge tree
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci_policy/verify_pr_tip.py --expected-head "$EXPECTED_PR_HEAD"

      # Keep one mandatory GitHub status; run global checks for shared/unknown
      # changes and only focused regressions for known independent components.
      - name: Verify risk-selected baseline policy, registry and SQLite
        run: python3 tools/ci_policy/run_scoped_pr_tests.py --baseline

      # Reuse the required gate; no extra worker for unrelated pull requests.
      # Selection is computed from the checked-out synthetic PR merge tree,
      # not attacker-controlled shell fragments from the PR title or body.
      # The audio QA suite synthesizes OGG/MP3/WebM fixtures with ffmpeg.
      # Provision it only when the exact synthetic merge diff selects audio;
      # never silently skip the suite if the dependency is unavailable.
      - name: Provision selected audio QA dependency
        shell: bash
        run: |
          set -euo pipefail
          required="$(python3 -c 'from tools.ci_policy.run_scoped_pr_tests import changed_in_synthetic_merge, select_suites; print("true" if "audio" in select_suites(changed_in_synthetic_merge()) else "false")')"
          if [[ "$required" == "true" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          elif [[ "$required" != "false" ]]; then
            echo "Invalid audio fixture selection" >&2
            exit 1
          fi
      - name: Provision selected JSON Schema validation dependency
        shell: bash
        run: |
          set -euo pipefail
          needed="$(python3 -c 'from tools.ci_policy.run_scoped_pr_tests import changed_in_synthetic_merge, select_suites; selected = select_suites(changed_in_synthetic_merge()); print("true" if "final_evidence" in selected or "directed_pairs" in selected else "false")')"
          if [[ "$needed" == "true" ]]; then
            timeout 90s python3 -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.26.0
          elif [[ "$needed" != "false" ]]; then
            echo "Invalid JSON Schema test dependency selection" >&2
            exit 1
          fi
      - name: Run affected subsystem regression tests
        run: python3 tools/ci_policy/run_scoped_pr_tests.py
