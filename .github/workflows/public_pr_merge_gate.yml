# This REQUIRED PR gate must never use paths/path-ignore or a job-level if.
# HEAD commits carrying [skip ci] suppress pull_request, so the integrating
# commit MUST NOT contain a CI-skip token. See docs/CI_MERGE_POLICY.md.
name: Public PR Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: public-pr-merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-pr-merge-gate:
    name: public-pr-merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out GitHub synthetic PR merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Authenticate exact PR head and reject CI skip instructions
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci_policy/verify_pr_tip.py --expected-head "$EXPECTED_PR_HEAD"

      - name: Verify policy regressions
        run: python3 -m unittest discover -s tests/ci_policy -p 'test_*.py' -v

      - name: Verify canonical 100-language registry
        run: python3 catalog/validate_registry.py

      - name: Verify public SQLite v2 fixture pipeline (no publication)
        run: python3 tools/test_store_pipeline.py -q

      # Reuse the required gate; no extra worker for unrelated pull requests.
      # Selection is computed from the checked-out synthetic PR merge tree,
      # not attacker-controlled shell fragments from the PR title or body.
      # The audio QA suite synthesizes OGG/MP3/WebM fixtures with ffmpeg.
      # Provision it only when the exact synthetic merge diff selects audio;
      # never silently skip the suite if the dependency is unavailable.
      - name: Detect required audio fixture tooling
        id: audio_fixtures
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from tools.ci_policy.run_scoped_pr_tests import changed_in_synthetic_merge, select_suites
          print("required=" + ("true" if "audio" in select_suites(changed_in_synthetic_merge()) else "false"))
          PY
      - name: Install ffmpeg for selected audio QA
        if: steps.audio_fixtures.outputs.required == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run affected subsystem regression tests
        run: python3 tools/ci_policy/run_scoped_pr_tests.py
