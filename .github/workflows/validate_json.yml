name: Validate JSON Files
# Auxiliary JSON validation runs only for JSON and its own security contract.
# The universal required public-pr-merge-gate continues on every PR.
on:
  pull_request:
    paths:
      - '**/*.json'
      - '.github/workflows/validate_json.yml'
      - 'tests/ci_security/**'
  push:
    branches: [main]
    paths:
      - '**/*.json'
      - '.github/workflows/validate_json.yml'
      - 'tests/ci_security/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JSON Syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.json' -not -path './.git/*' -print0 |
            xargs -0 -r -n 1 sh -c '
              if ! jq empty "$1" >/dev/null 2>&1; then
                printf "Invalid JSON: %s\n" "$1" >&2
                exit 1
              fi
            ' _
      - name: Adversarial filename regression tests
        run: python3 -m unittest discover -s tests/ci_security -p 'test_*.py' -v
