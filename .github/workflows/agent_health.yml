name: Agent health
on:
  workflow_dispatch:
  schedule:
    - cron: '8 0,4,8,12,16,20 * * *'
permissions:
  contents: write
  actions: read
  issues: write
concurrency:
  group: agent-health
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Load the last committed snapshot
        run: bash tools/agents/prepare.sh
      - name: Verify bounded failure selection
        run: python3 -m unittest tools.agents.test_health_failure_selection -v
      - name: Run health
        id: work
        continue-on-error: true
        env:
          AGENTS_HALT: ${{ vars.AGENTS_HALT }}
          LANGUAGE_PRODUCTION_HALT: ${{ vars.LANGUAGE_PRODUCTION_HALT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Full workflow identity, source branch and PR number avoid cross-PR
          # success masking. Single bounded page; no untrusted query input.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '
            .workflow_runs | map({
              databaseId: .id,
              workflowName: .name,
              event: .event,
              pullRequest: (if (.pull_requests | length) == 1 then .pull_requests[0].number else null end),
              headRepository: .head_repository.full_name,
              headBranch: .head_branch,
              headSha: .head_sha,
              conclusion: .conclusion,
              status: .status
            })
          ' > /tmp/agent-health-runs.json
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          from tools.agents.root_cause import select_active_failures

          runs = json.loads(Path('/tmp/agent-health-runs.json').read_text(encoding='utf-8'))
          selected = select_active_failures(runs, cap=3)
          if not selected:
              # No current failure: refresh health without creating a fake issue.
              subprocess.run(
                  ['python3', '-m', 'tools.agents.cli', 'repair',
                   '--signature', 'no-signature'], check=True
              )
          for item in selected:
              subprocess.run(
                  ['python3', '-m', 'tools.agents.cli', 'repair',
                   '--signature', item['name'],
                   '--run-id', str(item['databaseId']), '--file-issue'], check=True
              )
          print(json.dumps({'current_failed_workflows': len(selected),
                            'observed_run_ids': [r['databaseId'] for r in selected]}))
          PY

      - name: Publish the checkpoint
        if: always()
        run: bash tools/agents/publish.sh health
      - name: Record the agent result
        if: steps.work.outcome == 'failure'
        run: exit 1
