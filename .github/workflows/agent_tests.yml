name: Agent tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/agents/**'
      - 'state/**'
      - '.github/workflows/agent_*.yml'
      - 'AGENTS.md'
permissions:
  contents: read
concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run agent tests
        run: python3 -m unittest tools.agents.test_agents -q
