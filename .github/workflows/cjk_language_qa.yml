name: CJK language QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/linguistic_extensions/cjk/**'
      - 'tests/linguistic_extensions/cjk/**'
      - '.github/workflows/cjk_language_qa.yml'
permissions:
  contents: read
jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python synthetic evidence isolation and CJK regressions
        run: python3 -m unittest discover -s tests/linguistic_extensions/cjk -p 'test_*.py' -v
