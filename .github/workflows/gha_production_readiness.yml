# Read-only inventory; never manufactures content or bypasses Route05 source approval.
name: Public factory production readiness
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  pull_request:
    paths:
      - 'tools/gha_factory/production_readiness/**'
      - 'tests/gha_factory/production_readiness/**'
      - '.github/workflows/gha_production_readiness.yml'
permissions:
  contents: read
concurrency:
  group: public-production-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'moaz76943-creator/-offline-packs-store'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify synthetic audit regression scenarios
        run: python3 -m unittest discover -s tests/gha_factory/production_readiness -p 'test_*.py' -v
      - name: Record verified live inventory and production blockers
        run: python3 -m tools.gha_factory.production_readiness.audit
