name: SQLite v2 scale and Unicode evidence QA (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/factory_extensions/sqlite_scale_qa/**'
      - 'tests/factory_extensions/sqlite_scale_qa/**'
      - '.github/workflows/sqlite_scale_qa.yml'
permissions:
  contents: read
concurrency:
  group: sqlite-scale-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install existing canonical schema validator
        run: timeout 90s python3 -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.26.0
      - name: Read-only tests and source admission gate
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 2097152
          ulimit -f 262144
          export PYTHONDONTWRITEBYTECODE=1
          timeout 160s python3 -m unittest discover -s tests/factory_extensions/sqlite_scale_qa -p 'test_*.py' -v
          timeout 120s python3 -m unittest discover -s tests/gha_factory/pack_conformance -p 'test_*.py' -v
          timeout 30s python3 -m tools.factory_extensions.sqlite_scale_qa.verify --root . > "$RUNNER_TEMP/sqlite-scale-status.json"
          cat "$RUNNER_TEMP/sqlite-scale-status.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP'])/'sqlite-scale-status.json').read_text())
          assert result['publication_approved'] is False
          assert result['registered_languages'] == 100
          assert result['actual_packs_verified'] == 0
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('SQLite v2 isolated QA tests passed. Real approved compile: NOT RUN.\n')
              out.write('Signatures, candidate release QA and promotion: NOT VERIFIED.\n')
          PY
          git diff --exit-code -- manifest.json version.json packs/ legal/ledger/sources.json
