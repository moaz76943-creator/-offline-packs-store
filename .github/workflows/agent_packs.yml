name: Agent packs
on:
  workflow_dispatch:
  schedule:
    - cron: '52 4,10,16,22 * * *'
permissions:
  contents: write
concurrency:
  group: agent-packs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Load the last committed snapshot
        run: bash tools/agents/prepare.sh
      - name: Run packs
        id: work
        continue-on-error: true
        env:
          AGENTS_HALT: ${{ vars.AGENTS_HALT }}
          LANGUAGE_PRODUCTION_HALT: ${{ vars.LANGUAGE_PRODUCTION_HALT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m tools.agents.cli packs

      - name: Publish the checkpoint
        if: always()
        run: bash tools/agents/publish.sh packs
      - name: Record the agent result
        if: steps.work.outcome == 'failure'
        run: exit 1
