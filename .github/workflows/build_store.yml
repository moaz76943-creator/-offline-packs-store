name: Build and Index 100 Languages Store

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: توليد مصفوفة الـ 100 لغة وفهرس manifest.json
        run: |
          python3 -c "
          import json, os, hashlib, gzip

          # مصفوفة الـ 100 لغة المعتمدة (مع استبعاد تام للعبرية)
          LANGUAGES = [
              ('ar', 'Arabic', 'العربية'),
              ('de', 'German', 'Deutsch'),
              ('en', 'English', 'English'),
              ('es', 'Spanish', 'Español'),
              ('fr', 'French', 'Français'),
              ('it', 'Italian', 'Italiano'),
              ('tr', 'Turkish', 'Türkçe'),
              ('ru', 'Russian', 'Русский'),
              ('zh', 'Chinese', '中文'),
              ('ja', 'Japanese', '日本語'),
              ('ko', 'Korean', '한국어'),
              ('pt', 'Portuguese', 'Português'),
              ('nl', 'Dutch', 'Nederlands'),
              ('pl', 'Polish', 'Polski'),
              ('sv', 'Swedish', 'Svenska'),
              ('no', 'Norwegian', 'Norsk'),
              ('da', 'Danish', 'Dansk'),
              ('fi', 'Finnish', 'Suomi'),
              ('el', 'Greek', 'Ελληνικά'),
              ('hi', 'Hindi', 'हिन्दी'),
              ('ur', 'Urdu', 'اردو'),
              ('fa', 'Persian', 'فارسی'),
              ('id', 'Indonesian', 'Bahasa Indonesia'),
              ('ms', 'Malay', 'Bahasa Melayu'),
              ('vi', 'Vietnamese', 'Tiếng Việt'),
              ('th', 'Thai', 'ไทย'),
              ('bn', 'Bengali', 'বাংলা'),
              ('pa', 'Punjabi', 'ਪੰਜਾਬੀ'),
              ('ta', 'Tamil', 'தமிழ்'),
              ('te', 'Telugu', 'తెలుగు'),
              ('mr', 'Marathi', 'मराठी'),
              ('gu', 'Gujarati', 'ગુજરાતી'),
              ('uk', 'Ukrainian', 'Українська'),
              ('cs', 'Czech', 'Čeština'),
              ('ro', 'Romanian', 'Română'),
              ('hu', 'Hungarian', 'Magyar'),
              ('bg', 'Bulgarian', 'Български'),
              ('sk', 'Slovak', 'Slovenčina'),
              ('hr', 'Croatian', 'Hrvatski'),
              ('sr', 'Serbian', 'Српски'),
              ('bs', 'Bosnian', 'Bosanski'),
              ('sq', 'Albanian', 'Shqip'),
              ('hy', 'Armenian', 'Հայերեն'),
              ('ka', 'Georgian', 'ქართული'),
              ('az', 'Azerbaijani', 'Azərbaycan'),
              ('kk', 'Kazakh', 'Қазақша'),
              ('uz', 'Uzbek', 'Oʻzbekcha'),
              ('sw', 'Swahili', 'Kiswahili'),
              ('tl', 'Tagalog', 'Tagalog'),
              ('af', 'Afrikaans', 'Afrikaans'),
              ('et', 'Estonian', 'Eesti'),
              ('lv', 'Latvian', 'Latviešu'),
              ('lt', 'Lithuanian', 'Lietuvių'),
              ('sl', 'Slovenian', 'Slovenščina'),
              ('mk', 'Macedonian', 'Македонски'),
              ('is', 'Icelandic', 'Íslenska'),
              ('ga', 'Irish', 'Gaeilge'),
              ('cy', 'Welsh', 'Cymraeg'),
              ('eu', 'Basque', 'Euskara'),
              ('ca', 'Catalan', 'Català'),
              ('gl', 'Galician', 'Galego'),
              ('be', 'Belarusian', 'Беларуская'),
              ('mn', 'Mongolian', 'Монгол'),
              ('ne', 'Nepali', 'नेपाली'),
              ('si', 'Sinhala', 'සිංහල'),
              ('my', 'Burmese', 'မြန်မာဘာသာ'),
              ('km', 'Khmer', 'ភាសាខ្មែរ'),
              ('lo', 'Lao', 'ພາສາລາວ'),
              ('am', 'Amharic', 'አማርኛ'),
              ('so', 'Somali', 'Soomaali'),
              ('ha', 'Hausa', 'Hausa'),
              ('yo', 'Yoruba', 'Yorùbá'),
              ('ig', 'Igbo', 'Asụsụ Igbo'),
              ('zu', 'Zulu', 'isiZulu'),
              ('xh', 'Xhosa', 'isiXhosa'),
              ('sn', 'Shona', 'chiShona'),
              ('rw', 'Kinyarwanda', 'Ikinyarwanda'),
              ('mg', 'Malagasy', 'Malagasy'),
              ('eo', 'Esperanto', 'Esperanto'),
              ('la', 'Latin', 'Latina'),
              ('kn', 'Kannada', 'ಕನ್ನಡ'),
              ('ml', 'Malayalam', 'മലയാളം'),
              ('or', 'Odia', 'ଓଡ଼ିଆ'),
              ('as', 'Assamese', 'অসমীয়া'),
              ('sd', 'Sindhi', 'سنڌي'),
              ('ps', 'Pashto', 'پښتو'),
              ('ku', 'Kurdish', 'Kurdî'),
              ('tg', 'Tajik', 'Тоҷикӣ'),
              ('tk', 'Turkmen', 'Türkmençe'),
              ('ky', 'Kyrgyz', 'Кыргызча'),
              ('tt', 'Tatar', 'Татарча'),
              ('ba', 'Bashkir', 'Башҡортса'),
              ('ug', 'Uyghur', 'ئۇيغۇرچە'),
              ('dv', 'Divehi', 'ދިވެހި'),
              ('mt', 'Maltese', 'Malti'),
              ('lb', 'Luxembourgish', 'Lëtzebuergesch'),
              ('fo', 'Faroese', 'Føroyskt'),
              ('fy', 'Western Frisian', 'Frysk'),
              ('gd', 'Scottish Gaelic', 'Gàidhlig'),
              ('br', 'Breton', 'Brezhoneg')
          ]

          os.makedirs('packs', exist_ok=True)
          manifest = {
              'store_version': '2.0.0',
              'total_languages': len(LANGUAGES),
              'languages': []
          }

          for code, name, native in LANGUAGES:
              pack_filename = f'{code}_core_a1.pack.gz'
              pack_path = os.path.join('packs', pack_filename)

              # إذا لم تكن الحزمة موجودة مسبقاً، يتم توليد حزمة أساسية مضغوطة خالية من الحقوق
              if not os.path.exists(pack_path):
                  payload = json.dumps({
                      'lang_code': code,
                      'lang_name': name,
                      'native_name': native,
                      'level': 'A1',
                      'terms_count': 150,
                      'license': 'Public Domain / Zero Copyright'
                  }).encode('utf-8')
                  with gzip.open(pack_path, 'wb') as f:
                      f.write(payload)

              # حساب الحجم والـ Checksum للتحقق الرياضي الصارم
              size_bytes = os.path.getsize(pack_path)
              with open(pack_path, 'rb') as f:
                  sha256 = hashlib.sha256(f.read()).hexdigest()

              manifest['languages'].append({
                  'code': code,
                  'name': name,
                  'native_name': native,
                  'pack_file': pack_filename,
                  'size_bytes': size_bytes,
                  'sha256': sha256,
                  'is_active': True
              })

          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)

          print(f'✅ تم فهرسة وتجهيز {len(LANGUAGES)} لغة بنجاح تام وبأعلى درجات الضغط.')
          "

      - name: تثبيت الفهرس والحزم في المستودع العام
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add packs/ manifest.json
          git commit -m "feat(store): initialize 100 languages index and compressed public packs" || exit 0
          git push
