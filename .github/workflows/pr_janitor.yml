# Labels blocked PRs and squash-merges one PR that is already up to date with a
# green public-pr-merge-gate. It does not push: a GITHUB_TOKEN push would not
# retrigger that required pull_request check. See ROOT_CAUSES.md.
name: PR janitor

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-janitor
  cancel-in-progress: false

jobs:
  janitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Label blockers and merge one ready pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pr_janitor.py --merge-one
