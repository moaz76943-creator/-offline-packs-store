# Labels blocked PRs on a schedule. Never merges: the incumbent
# public_merge_coordinator is the single protected-main integration authority.
name: PR blocker-label janitor

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-janitor
  cancel-in-progress: false

jobs:
  janitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Label blockers without integrating pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pr_janitor.py
