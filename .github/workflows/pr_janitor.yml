# Two disjoint PR label scouts; PR tests now run inside the required merge gate.
# the event-driven canonical coordinator alone merges PRs.
name: PR blocker-label janitor

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-janitor-scheduled
  cancel-in-progress: false

jobs:
  scout:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Classify disjoint half of open PRs without merging
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: python3 tools/pr_janitor.py --shard-count 2 --shard-index "$SHARD"
