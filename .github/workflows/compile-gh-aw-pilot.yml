name: Compile official gh-aw pilot lock (temporary)
on:
  push:
    branches: [ops/gh-aw-public-triage-20261015]
    paths:
      - .github/workflows/deutsch-pr-recovery.md
      - .github/workflows/compile-gh-aw-pilot.yml
permissions:
  contents: read
concurrency:
  group: gh-aw-temp-compile-20261015
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install official pinned gh-aw compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-aw --pin v0.88.7
          gh aw version
      - name: Compile source and export generated lock
        run: |
          set -euo pipefail
          gh aw compile
          test -s .github/workflows/deutsch-pr-recovery.lock.yml
          echo __GH_AW_LOCK_B64_START__
          base64 -w0 .github/workflows/deutsch-pr-recovery.lock.yml
          echo
          echo __GH_AW_LOCK_B64_END__
