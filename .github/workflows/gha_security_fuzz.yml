name: Public SQLite v2 security fuzz (synthetic only)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 2'
  pull_request:
    paths:
      - 'tools/gha_factory/security_fuzz/**'
      - 'tests/gha_factory/security_fuzz/**'
      - '.github/workflows/gha_security_fuzz.yml'

permissions:
  contents: read

concurrency:
  group: security-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family: [envelope, sqlite, provenance, signature, staging]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Limit resources and test canonical public contracts
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          ulimit -v 786432
          ulimit -f 65536
          ulimit -t 420
          export PYTHONDONTWRITEBYTECODE=1
          if [ "$FAMILY" = "envelope" ]; then
            python3 -m unittest discover -s tests/gha_factory/security_fuzz -p 'test_*.py' -v
          fi
          python3 tools/gha_factory/security_fuzz/harness.py \
            --family "$FAMILY" --seed 20261013 --max-cases 48 \
            --out "$RUNNER_TEMP/security-fuzz-$FAMILY.json"
      - name: Upload compact non-sensitive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-fuzz-${{ matrix.family }}
          path: ${{ runner.temp }}/security-fuzz-${{ matrix.family }}.json
          if-no-files-found: ignore
          retention-days: 1
