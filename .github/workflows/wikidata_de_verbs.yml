# Manual, bounded Wikidata lexeme extract. Does not commit, push, or edit the ledger.
name: Wikidata German verb candidate

on:
  pull_request:
    paths:
      - 'tools/wikidata_lexemes/**'
      - '.github/workflows/wikidata_de_verbs.yml'
  workflow_dispatch:
    inputs:
      dump_date:
        description: 'Official dump date YYYYMMDD'
        required: true
        default: '20261014'
      max_bytes:
        description: 'Maximum compressed bytes to download (1048576..268435456)'
        required: true
        default: '8388608'
      max_lexemes:
        description: 'Maximum German verbs to consider (1..2000)'
        required: true
        default: '200'

permissions:
  contents: read

concurrency:
  group: wikidata-de-verbs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install lexical schema validator
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.26.0
      - name: Run fixture tests
        run: python3 -m unittest tools.wikidata_lexemes.test_extract_de_verbs -v

  extract:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install lexical schema validator
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.26.0
      - name: Download a bounded dump and write a candidate
        env:
          DUMP_DATE: ${{ inputs.dump_date }}
          MAX_BYTES: ${{ inputs.max_bytes }}
          MAX_LEXEMES: ${{ inputs.max_lexemes }}
        run: |
          set -euo pipefail
          if ! [[ "$DUMP_DATE" =~ ^[0-9]{8}$ ]]; then
            echo "dump_date must be YYYYMMDD" >&2
            exit 1
          fi
          if ! [[ "$MAX_BYTES" =~ ^[0-9]+$ ]] || [ "$MAX_BYTES" -lt 1048576 ] || [ "$MAX_BYTES" -gt 268435456 ]; then
            echo "max_bytes must be 1048576..268435456" >&2
            exit 1
          fi
          if ! [[ "$MAX_LEXEMES" =~ ^[0-9]+$ ]] || [ "$MAX_LEXEMES" -lt 1 ] || [ "$MAX_LEXEMES" -gt 2000 ]; then
            echo "max_lexemes must be 1..2000" >&2
            exit 1
          fi
          file="wikidata-${DUMP_DATE}-lexemes.json.gz"
          base="https://dumps.wikimedia.org/wikidatawiki/entities/${DUMP_DATE}"
          work="dist/candidates/wikidata-lexemes"
          mkdir -p "$work/in"
          curl -fsSL --retry 2 --max-time 90 -o "$work/in/wikidata-${DUMP_DATE}-sha1sums.txt" "$base/wikidata-${DUMP_DATE}-sha1sums.txt"
          last=$((MAX_BYTES - 1))
          http_code="$(curl -fL --retry 2 --max-time 180 --max-filesize "$MAX_BYTES" -o "$work/in/$file" -w '%{http_code}' -r "0-${last}" "$base/$file")"
          if [ "$http_code" != "206" ]; then
            echo "dump download must return HTTP 206, got ${http_code}" >&2
            exit 1
          fi
          downloaded="$(wc -c < "$work/in/$file" | tr -d '[:space:]')"
          if ! [[ "$downloaded" =~ ^[0-9]+$ ]] || [ "$downloaded" -lt 1 ] || [ "$downloaded" -gt "$MAX_BYTES" ]; then
            echo "downloaded dump is ${downloaded:-missing} bytes; limit is ${MAX_BYTES}" >&2
            exit 1
          fi
          python3 tools/wikidata_lexemes/extract_de_verbs.py \
            --dump "$work/in/$file" \
            --checksums "$work/in/wikidata-${DUMP_DATE}-sha1sums.txt" \
            --output "$work/de-verbs.sqlite" \
            --max-bytes "$MAX_BYTES" \
            --max-lexemes "$MAX_LEXEMES" \
            --dataset-version "$DUMP_DATE" \
            --origin-url "$base/$file" \
            --repo-root "$GITHUB_WORKSPACE"
          rm -rf "$work/in"
      - name: Upload unverified candidate
        uses: actions/upload-artifact@v4
        with:
          name: unverified-wikidata-de-verbs-candidate
          path: dist/candidates/wikidata-lexemes/
          if-no-files-found: error
          retention-days: 14
