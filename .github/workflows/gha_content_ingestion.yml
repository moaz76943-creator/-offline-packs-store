# Read-only adapter verification. No source download, queue claims or publication.
name: GHA content ingestion adapter contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/gha_factory/content_ingestion/**'
      - 'tests/gha_factory/content_ingestion/**'
      - '.github/workflows/gha_content_ingestion.yml'
permissions:
  contents: read
concurrency:
  group: gha-content-ingestion-test-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public contract validator
        run: python -m pip install 'jsonschema==4.26.0'
      - name: Bounded synthetic-only adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 786432
          ulimit -t 600
          python -m unittest discover -s tests/gha_factory/content_ingestion -p 'test_*.py' -v
          python -m unittest discover -s tests/gha_factory/admission -p 'test_*.py' -v
          python -m unittest discover -s tools/sources/pilot5 -p 'test_*.py' -v
          python catalog/validate_registry.py
