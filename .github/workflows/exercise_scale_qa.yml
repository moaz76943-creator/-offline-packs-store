name: Exercise scale evidence and rights QA

on:
  pull_request:
    paths:
      - 'tools/factory_extensions/exercise_scale/**'
      - 'tests/factory_extensions/exercise_scale/**'
      - '.github/workflows/exercise_scale_qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic negative QA
        run: python3 -m unittest discover -s tests/factory_extensions/exercise_scale -p 'test_*.py' -v
      - name: Inspect actual source rights without publication
        run: |
          python3 -m tools.factory_extensions.exercise_scale.engine --repo-root . --report /tmp/exercise-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/exercise-report.json').read_text())
          assert report['registered_languages'] == 100
          assert report['verified_exercises'] == 0
          print('STATUS', report['status'])
          print('APPROVED_SOURCE_COUNT', report['approved_source_count'])
          print('VERIFIED_EXERCISES', report['verified_exercises'])
          print('NO_AUTOMATIC_PROMOTION_OR_DISPATCH')
          PY
